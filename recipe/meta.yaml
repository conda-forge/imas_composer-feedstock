{% set name = "imas_composer" %}
{% set version = "0.2.4" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"
source:
  url: https://github.com/GA-FDP/imas_composer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 75b67e6adab32febfcd6680d2910d0db9aafe5a43a1f4ed901454f55d10904dc

build:
  noarch: python
  number: 0

outputs:
  - name: imas_composer
    script: install_base.sh
    build:
      noarch: python
      entry_points:
        - iri-cake-viewer = imas_composer.plots.iri_cake_viewer:main
    requirements:
      host:
        - python {{ python_min }}
        - pip
        - setuptools >=61.0
        - wheel
      run:
        - python >={{ python_min }}
        - numpy >=1.20
        - pyyaml >=5.4
        - awkward >=2.0
    test:
      imports:
        - imas_composer
        - imas_composer.ids
      commands:
        - pip check
      requires:
        - python {{ python_min }}
        - pip

  # Metapackage supplying the optional GUI stack for iri-cake-viewer
  # (conda equivalent of `pip install imas_composer[plots]`)
  - name: imas_composer_plots
    build:
      noarch: python
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage('imas_composer', exact=True) }}
        - pyqtgraph
        - pyside6
        - scipy
        - contourpy
        - pyodbc
        - freetds
        - mdsplus
        - omas
    test:
      imports:
        - imas_composer.plots
      commands:
        - iri-cake-viewer --help
      requires:
        - python {{ python_min }}

about:
  home: https://github.com/GA-FDP/imas_composer
  summary: A Python library for converting DIII-D MDSplus data to IMAS format
  description: |
    IMAS Composer provides a clean, declarative API for mapping DIII-D diagnostic
    and analysis data (stored in MDSplus) to standardized IMAS v3.41.0 data
    structures (IDS - Interface Data Structures). It handles requirement
    identification, data transformation, COCOS conversions, and composition.
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://github.com/GA-FDP/imas_composer/blob/main/README.md
  dev_url: https://github.com/GA-FDP/imas_composer

extra:
  recipe-maintainers:
    - arewedreaming
    - modestmc
    - smithsp
    - sammuli
